<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>子账户 · 千川方舟 ERP</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar-mount" data-active="advertisers"></aside>
  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">子账户</div>
      <div class="topbar-right">
        <span class="status-pill bad" id="token-pill"><span class="status-dot"></span>未授权</span>
      </div>
    </header>
    <main class="content">
      <div class="panel" style="padding-bottom:14px;">
        <div class="toolbar toolbar-wrap">
          <div class="panel-title" style="margin:0;">数据概览 · 整体(不含标准)</div>
          <div class="spacer"></div>
          <div class="field">
            <label>时间</label>
            <select id="dash-range">
              <option value="today" selected>今天</option>
              <option value="7">近7天</option>
              <option value="30">近30天</option>
              <option value="custom">自定义</option>
            </select>
          </div>
          <div class="field custom-dates hidden" id="custom-dates">
            <label>开始</label>
            <input type="date" id="dash-start">
          </div>
          <div class="field custom-dates hidden" id="custom-dates-end">
            <label>结束</label>
            <input type="date" id="dash-end">
          </div>
          <span class="muted" id="dash-range-text">-</span>
          <div class="field">
            <label>佣金比例 %</label>
            <input id="dash-commission" type="number" min="0" max="100" step="0.1" value="20">
          </div>
          <button class="btn btn-primary" id="btn-load-dash">刷新数据</button>
          <button class="btn" id="btn-sync">同步子账户</button>
        </div>
        <p class="hint" id="dash-hint">今天/7天/30天读 Redis 缓存；点刷新会删缓存重拉。自定义日期直接调接口。</p>
      </div>

      <div class="stats stats-5">
        <div class="stat-card">
          <div class="stat-num" id="ov-cost">-</div>
          <div class="stat-label">整体消耗</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="ov-pay">-</div>
          <div class="stat-label">用户实际支付金额</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="ov-roi">-</div>
          <div class="stat-label">整体支付 ROI</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="ov-settle">-</div>
          <div class="stat-label">净成交金额</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="ov-settle-roi">-</div>
          <div class="stat-label">净成交 ROI</div>
        </div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <div class="panel-title" style="margin:0;">账户列表</div>
          <button class="btn" type="button" id="btn-reset-filter">重置筛选</button>
          <div class="spacer"></div>
          <span class="muted" id="avg-plan-profit">利润合计 -</span>
          <span class="muted" id="account-count">共 0 个</span>
        </div>
        <div class="table-wrap">
          <table id="adv-table">
            <thead>
              <tr>
                <th>账户信息</th>
                <th>账户状态</th>
                <th class="sortable" data-sort="stat_cost">整体消耗 <span class="sort-ind"></span></th>
                <th class="sortable" data-sort="pay_roi">整体支付ROI <span class="sort-ind"></span></th>
                <th class="sortable" data-sort="pay_amount">用户实际支付金额 <span class="sort-ind"></span></th>
                <th class="sortable" data-sort="settle_amount">净成交金额 <span class="sort-ind"></span></th>
                <th class="sortable" data-sort="settle_roi">净成交ROI <span class="sort-ind"></span></th>
                <th class="sortable" data-sort="refund_rate_1h">1小时内退款率 <span class="sort-ind"></span></th>
                <th class="sortable" data-sort="avg_plan_profit">平均计划利润 <span class="sort-ind"></span></th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="advertiser-tbody">
              <tr><td colspan="10" class="empty">正在加载…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="loading-mask hidden" id="loading-mask">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-title" id="loading-title">正在拉取数据…</div>
    <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="loading-msg muted" id="loading-msg">0%</div>
  </div>
</div>

<script src="/static/js/common.js"></script>
<script src="/static/js/partials.js"></script>
<script src="/static/js/reminders.js"></script>
<script src="/static/js/advertisers.js?v=20261030e"></script>
</body>
</html>
