<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号合计 · 千川方舟 ERP</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/css/app.css?v=20261117c">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar-mount" data-active="compare"></aside>
  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">账号合计</div>
      <div class="topbar-right">
        <span class="status-pill bad" id="token-pill"><span class="status-dot"></span>未授权</span>
      </div>
    </header>
    <main class="content">
      <div class="panel" style="padding-bottom:14px;">
        <div class="toolbar toolbar-wrap">
          <div class="panel-title" style="margin:0;">账号合计</div>
          <div class="spacer"></div>
          <div class="field">
            <label>时间</label>
            <select id="ov-range">
              <option value="today" selected>今天</option>
              <option value="yesterday">昨天</option>
              <option value="7">7天内</option>
              <option value="30">30天内</option>
              <option value="custom">自定义</option>
            </select>
          </div>
          <div class="field ov-custom hidden"><label>开始</label><input type="date" id="ov-start"></div>
          <div class="field ov-custom hidden"><label>结束</label><input type="date" id="ov-end"></div>
          <button class="btn btn-primary" id="btn-query">查询</button>
        </div>
        <p class="hint">最上面是合计，下面两个授权账号各一块。消耗、预估总利润、用户实际支付金额、净成交金额、运营数直接相加。整体支付 ROI、净成交 ROI 用加总后的金额重算，预估总利润率用合计利润 ÷ 合计支付金额，1 小时内退款率按支付金额加权。</p>
        <p class="hint" id="ov-meta">-</p>
      </div>
      <div id="compare-boards"></div>
    </main>
  </div>
</div>

<div class="loading-mask hidden" id="loading-mask">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-title">正在分别读取两个授权账号…</div>
    <div class="loading-sub muted">每个账号都按数据总览同一套算法出数，读完再相加</div>
  </div>
</div>

<script src="/static/js/common.js?v=20261103u"></script>
<script src="/static/js/partials.js?v=20261117e"></script>
<script src="/static/js/compare.js?v=20261117d"></script>
</body>
</html>
