<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授权账号信息 · 千川方舟 ERP</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar-mount" data-active="auth"></aside>
  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">授权账号信息</div>
      <div class="topbar-right">
        <span class="status-pill bad" id="token-pill"><span class="status-dot"></span>未授权</span>
      </div>
    </header>
    <main class="content">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-num" id="stat-token">-</div>
          <div class="stat-label">Token 状态</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-agent" style="font-size:18px;">-</div>
          <div class="stat-label">管理账户 agent_id</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-adv">0</div>
          <div class="stat-label">已同步子账户</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-expire" style="font-size:15px;">-</div>
          <div class="stat-label">Token 过期时间</div>
        </div>
      </div>
      <div class="panel" style="padding-top:12px;padding-bottom:12px;">
        <div class="muted" id="stat-agent-name">管理账户名称 / 角色：-</div>
      </div>
      <div class="panel">
        <div class="panel-title">授权与同步</div>
        <div class="toolbar">
          <button class="btn btn-primary" id="btn-authorize">打开巨量授权</button>
          <button class="btn btn-accent" id="btn-sync-advertisers">同步全部子账户</button>
        </div>
        <input type="hidden" id="authorize-url" value="__AUTHORIZE_URL__">
        <p class="hint">
          点「打开巨量授权」完成授权后，系统会自动入库 token 并识别管理账户 agent_id。
          token 由后台定时刷新。授权完成后可点「同步全部子账户」。
        </p>
      </div>
    </main>
  </div>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/partials.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
