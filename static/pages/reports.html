<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投放报表 · 千川方舟 ERP</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar-mount" data-active="reports"></aside>
  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">投放报表</div>
      <div class="topbar-right">
        <span class="status-pill bad" id="token-pill"><span class="status-dot"></span>未授权</span>
      </div>
    </header>
    <main class="content">
      <div class="panel">
        <div class="toolbar">
          <div class="field">
            <label>子账户</label>
            <select id="report-advertiser"></select>
          </div>
          <div class="field">
            <label>开始日期</label>
            <input type="date" id="report-start">
          </div>
          <div class="field">
            <label>结束日期</label>
            <input type="date" id="report-end">
          </div>
          <button class="btn btn-primary" id="btn-sync-reports">同步报表</button>
          <button class="btn" id="btn-load-reports">读取本地</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>计划 ID</th>
                <th>消耗</th>
                <th>成交订单</th>
                <th>成交金额</th>
                <th>ROI</th>
              </tr>
            </thead>
            <tbody id="report-tbody">
              <tr><td colspan="6" class="empty">请选择子账户和日期</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/partials.js"></script>
<script src="/static/js/reports.js"></script>
</body>
</html>
