<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>团队管理 · 千川方舟 ERP</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/css/app.css?v=20261106h">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar-mount" data-active="team"></aside>
  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">团队管理</div>
      <div class="topbar-right">
        <span class="status-pill bad" id="token-pill"><span class="status-dot"></span>未授权</span>
      </div>
    </header>
    <main class="content">
      <div class="panel">
        <div class="toolbar">
          <div class="panel-title" style="margin:0;">团队管理</div>
          <div class="spacer"></div>
          <span class="muted" id="member-quota">成员 0</span>
        </div>
        <div class="table-wrap">
          <table class="team-table">
            <thead>
              <tr>
                <th>成员</th>
                <th>用户ID</th>
                <th>授权账户</th>
                <th>权限</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="member-tbody">
              <tr><td colspan="6" class="empty">正在加载…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-mask hidden" id="member-mask">
  <div class="modal modal-team" role="dialog" aria-modal="true">
    <h3 id="member-dialog-title">编辑成员</h3>
    <div class="perm-block">
      <div class="perm-label">操作权限</div>
      <div class="perm-row">
        <div>
          <b>数据报表</b>
          <p>查看投放数据与报表</p>
        </div>
        <div class="seg"><span class="on">仅查看</span></div>
      </div>
      <div class="perm-row">
        <div>
          <b>账户管理</b>
          <p>查看账户、预算、ROI，以及启停计划</p>
        </div>
        <div class="seg" id="seg-account">
          <button type="button" data-value="0">仅查看</button>
          <button type="button" data-value="1">可操作</button>
        </div>
      </div>
      <div class="perm-row">
        <div>
          <b>智能调控</b>
          <p>新建、删除计划，以及填写佣金和退款率</p>
        </div>
        <div class="seg" id="seg-plan">
          <button type="button" data-value="0">仅查看</button>
          <button type="button" data-value="1">可操作</button>
        </div>
      </div>
    </div>
    <div class="perm-label">可查看的千川账户</div>
    <div class="toolbar team-edit-tools">
      <input id="shop-search" type="search" placeholder="搜索账户名 / ID / 分组" autocomplete="off">
    </div>
    <div class="owner-chips" id="owner-chips"></div>
    <div class="toolbar team-edit-tools">
      <button class="btn" type="button" id="btn-all">全选</button>
      <button class="btn" type="button" id="btn-none">全不选</button>
      <button class="btn" type="button" id="btn-own">只看自己的店</button>
      <div class="spacer"></div>
      <span class="muted" id="shop-picked">已选 0/0 家</span>
    </div>
    <div class="team-shop-scroll" id="shop-list"></div>
    <p class="hint">自己的店默认勾着，取消勾选后就看不到。别人的店要勾上才看得到。</p>
    <p class="team-warn">保存后马上生效，这个账号不用重新登录。改成「仅查看」之后不能改对应的计划或开关，看数据不受影响。</p>
    <div class="modal-actions">
      <button class="btn" type="button" id="btn-cancel">取消</button>
      <button class="btn btn-primary" type="button" id="btn-save">保存</button>
    </div>
  </div>
</div>

<script src="/static/js/common.js?v=20261103u"></script>
<script src="/static/js/partials.js?v=20261106d"></script>
<script src="/static/js/team.js?v=20261106h"></script>
</body>
</html>
