<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 千川方舟 ERP</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="apple-touch-icon" href="/static/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-atmosphere" aria-hidden="true"></div>
    <main class="login-stage">
      <div class="brand-block">
        <img class="brand-logo" src="/static/img/logo.png" alt="千川方舟">
        <h1 class="brand-name">千川方舟 ERP</h1>
        <p class="brand-tag">投放数据一览 · 计划 ROI 调整</p>
      </div>

      <form class="login-form" id="login-form" novalidate>
        <label class="field">
          <span>账号</span>
          <input id="username" name="username" type="text" autocomplete="username" maxlength="64" placeholder="请输入账号" required>
        </label>
        <label class="field">
          <span>密码</span>
          <div class="pwd-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="请输入密码" required>
            <button type="button" class="pwd-toggle" id="pwd-toggle" aria-label="显示密码">显示</button>
          </div>
        </label>
        <p class="form-error hidden" id="form-error"></p>
        <button type="submit" class="submit" id="submit-btn">进入工作台</button>
      </form>
    </main>
  </div>
  <script src="/static/js/login.js"></script>
</body>
</html>
